name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-domain-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ./GestionFinanciera/GestionFinanciera.sln

      - name: Verify formatting
        run: dotnet format ./GestionFinanciera/GestionFinanciera.sln --verify-no-changes --no-restore

      - name: Build
        run: dotnet build ./GestionFinanciera/GestionFinanciera.sln --configuration Release --no-restore

      - name: Run domain tests
        run: dotnet test ./GestionFinanciera/tests/PolicyOperations.Domain.Tests/PolicyOperations.Domain.Tests.csproj --configuration Release --no-build

      - name: Audit NuGet packages
        run: dotnet list ./GestionFinanciera/GestionFinanciera.sln package --vulnerable --include-transitive
